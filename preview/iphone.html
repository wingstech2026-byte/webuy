<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WiBuy on iPhone</title>
<style>
  /* iPhone 15 screen: 393 x 852 points. The app runs inside at exactly that size. */
  :root { --w: 393px; --h: 852px; --bezel: 14px; --green: #15803D; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #e7e5e4; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .stage { transform-origin: center center; }
  .phone {
    position: relative;
    width: calc(var(--w) + var(--bezel) * 2);
    height: calc(var(--h) + var(--bezel) * 2);
    padding: var(--bezel);
    border-radius: 68px;
    background: #1c1c1e;
    box-shadow: 0 0 0 2px #3a3a3c, 0 30px 60px rgba(0,0,0,.35);
  }
  /* Side buttons */
  .phone::before, .phone::after { content: ""; position: absolute; background: #2c2c2e; border-radius: 2px; }
  .phone::before { left: -4px; top: 180px; width: 4px; height: 64px; box-shadow: 0 84px 0 #2c2c2e; }
  .phone::after { right: -4px; top: 240px; width: 4px; height: 100px; }
  .screen {
    position: relative; width: var(--w); height: var(--h);
    border-radius: 54px; overflow: hidden; background: #fff;
  }
  .status {
    position: absolute; inset: 0 0 auto 0; height: 54px; z-index: 2;
    background: var(--green); color: #fff;
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 30px 0 44px; font-weight: 600; font-size: 16px;
  }
  .status .icons { display: flex; gap: 6px; align-items: center; }
  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 124px; height: 36px; border-radius: 20px; background: #000; z-index: 3;
  }
  iframe {
    position: absolute; top: 54px; left: 0;
    width: var(--w); height: calc(var(--h) - 54px);
    border: 0; background: #f5f5f4;
  }
  .home-bar {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 3px; background: #111; z-index: 2; pointer-events: none;
  }
  .label { text-align: center; margin-top: 14px; color: #57534e; font-size: 13px; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="phone">
      <div class="screen">
        <div class="status">
          <span id="clock">9:41</span>
          <span class="icons">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="#fff"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.3-1.4A10.6 10.6 0 0 0 8 .3 10.6 10.6 0 0 0 .7 3.2L2 4.6a8.6 8.6 0 0 1 6-2.4zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.3-1.4A6.8 6.8 0 0 0 8 3.9a6.8 6.8 0 0 0-4.7 1.8l1.3 1.4C5.5 6.3 6.7 5.8 8 5.8zm0 3.5c.5 0 1 .2 1.3.5L8 11.2 6.7 9.8c.3-.3.8-.5 1.3-.5z"/></svg>
            <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" opacity=".5"/><rect x="2" y="2" width="18" height="9" rx="2" fill="#fff"/><rect x="25" y="4.5" width="1.5" height="4" rx=".7" fill="#fff" opacity=".5"/></svg>
          </span>
        </div>
        <div class="island"></div>
        <iframe src="http://localhost:8090" title="WiBuy app"></iframe>
        <div class="home-bar"></div>
      </div>
    </div>
    <div class="label">iPhone 15 · 393 × 852 · WiBuy app (live from Laravel)</div>
  </div>
<script>
  // Shrink the whole phone to fit small windows; never enlarge past real size.
  function fit() {
    const s = Math.min(1, (innerHeight - 20) / 920, (innerWidth - 20) / 440);
    document.getElementById('stage').style.transform = 'scale(' + s + ')';
  }
  addEventListener('resize', fit); fit();
  function tick() {
    const d = new Date();
    document.getElementById('clock').textContent = (d.getHours() % 12 || 12) + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tick(); setInterval(tick, 10000);
</script>
</body>
</html>
